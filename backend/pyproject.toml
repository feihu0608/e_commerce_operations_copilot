[project]
name = "ecommerce-operations-backend"
version = "0.1.0"
description = "电商运营助手 FastAPI 后端与异步任务服务"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery==5.5.3",
  "email-validator==2.3.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.2.10",
  "pyjwt==2.10.1",
  "python-multipart==0.0.20",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
