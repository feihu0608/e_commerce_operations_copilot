name: ecommerce-operations-assistant

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_ops}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce_ops_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce_ops} -d ${POSTGRES_DB:-ecommerce_ops}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 768m
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "160mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    mem_limit: 192m
    networks: [internal]

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecommerce_ops}:${POSTGRES_PASSWORD:-ecommerce_ops_dev}@postgres:5432/${POSTGRES_DB:-ecommerce_ops}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 12
    restart: unless-stopped
    mem_limit: 512m
    networks: [internal]

  worker:
    build: ./backend
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecommerce_ops}:${POSTGRES_PASSWORD:-ecommerce_ops_dev}@postgres:5432/${POSTGRES_DB:-ecommerce_ops}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 768m
    networks: [internal]

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
    networks: [internal]

networks:
  internal:

volumes:
  postgres_data:
  redis_data:
